<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantMe · Flow UX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-head">
      <strong>PlantMe / flow</strong>
      <span>Wireframes básicos · iOS 375 × 667</span>
      <a href="MAPA.md">Ler o mapa de fluxo</a>
    </div>
    <div id="screen-list"></div>

  <main class="workspace">

    <div id="view" class="view"></div>
    <div id="screen-note" class="note"></div>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>

</html>
